<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b5bdb" />
    <meta name="description" content="跨境电商翻译与本地化推荐：多语种商品翻译、本地化改写、合规预检与搜索推荐" />
    <link rel="manifest" href="/manifest.json" />
    <title>电子速购 E-SHOP Express</title>
    <!--
      首屏关键 CSS：只保留背景/字体/主容器，避免样式表到达前的白屏抖动。
      令牌与组件样式由 src/main.js 按 tokens → main → utilities 顺序引入，
      这里写死同名变量值即可，勿在此重复定义组件类（历史上曾因内联 150px 侧栏
      覆盖 212px 主样式表，导致首屏跳变）。
    -->
    <style>
      :root {
        --brand: #3b5bdb;
        --ink: #16181f;
        --ink-2: #4f5665;
        --ink-3: #6f7684;
        --line: #e4e7ee;
        --bg: #f5f6f9;
        --side: #111726;
        --side-w: 220px;
        --top-h: 56px;
        --r: 9px;
      }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f6f9;
        color: #16181f;
        font: 14px/1.65 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      #app { min-height: 100vh; }
      /* 首屏骨架：JS 挂载前显示品牌色细条，避免纯白闪烁 */
      #app:empty::before {
        content: '';
        position: fixed;
        inset: 0 0 auto 0;
        height: 2px;
        background: linear-gradient(90deg, #3b5bdb, #5f7ff0, #3b5bdb);
        animation: boot 1.2s ease-in-out infinite;
        transform-origin: 0 50%;
      }
      @keyframes boot {
        0% { transform: scaleX(.05); opacity: .9; }
        50% { transform: scaleX(.7); opacity: 1; }
        100% { transform: scaleX(1); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Service Worker 在开发环境不启用 -->

            .catch((error) => { console.log('Service Worker 注册失败:', error); });
        });
      }
    </script>
    -->
  </body>
</html>
